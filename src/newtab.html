<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <title>follient</title>
    <link rel="stylesheet" href="newtab.css" />
  </head>
  <body>
    <header class="topbar">
      <a class="up-link" id="up-link" href="#" hidden>
        <span class="up-icon" aria-hidden="true">↑</span>
        <span>上層に戻る</span>
      </a>
      <nav class="breadcrumb" id="breadcrumb" aria-label="現在のフォルダ"></nav>
    </header>

    <main>
      <div class="grid" id="grid"></div>
      <p class="empty" id="empty" hidden>このフォルダにはブックマークがありません。</p>
    </main>

    <!-- カードごとに持たせるとカードの overflow:hidden で切られるため、
         メニューは 1 つだけ作って body 直下に置き、開くたびに位置を合わせる。 -->
    <div class="card-menu" id="card-menu" role="menu" hidden></div>

    <template id="card-template">
      <div class="card">
        <a class="card-link" href="#">
          <div class="thumb">
            <div class="thumb-fallback"></div>
            <img class="thumb-img" alt="" decoding="async" />
            <div class="thumb-state" hidden>
              <span class="state-icon" aria-hidden="true"></span>
              <span class="state-label"></span>
            </div>
          </div>
          <div class="meta">
            <div class="title"></div>
            <div class="host"></div>
          </div>
        </a>
        <button
          class="menu-button"
          type="button"
          aria-haspopup="true"
          aria-expanded="false"
          aria-label="このカードの操作"
        >
          <span aria-hidden="true">⋮</span>
        </button>
      </div>
    </template>

    <script src="defaults.js"></script>
    <script src="newtab.js"></script>
  </body>
</html>
